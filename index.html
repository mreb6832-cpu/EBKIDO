<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7965d8">
  <title>EBKIDO - Learn, Play, Grow</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fbfaff;
      color: #302d49;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 6%;
      background: white;
      border-bottom: 1px solid #eeeafa;
      flex-wrap: wrap;
    }

    .brand {
      color: #5140a8;
      font-size: 25px;
      font-weight: 900;
    }

    select {
      padding: 10px;
      border: 1px solid #ddd5f7;
      border-radius: 10px;
      background: white;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 24px;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 40px;
      border-radius: 28px;
      background: linear-gradient(120deg, #e9e2ff, #ffe6d7);
    }

    h1 {
      font-size: clamp(30px, 5vw, 48px);
      margin: 12px 0;
    }

    .hero p { line-height: 1.6; }

    .hero-art {
      font-size: clamp(65px, 12vw, 120px);
      text-align: center;
    }

    .button {
      display: inline-block;
      padding: 13px 20px;
      border: 0;
      border-radius: 14px;
      background: #7965d8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }

    .section-title { margin-top: 38px; }

    .topics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 15px;
    }

    .topic {
      min-height: 150px;
      padding: 20px;
      border: 0;
      border-radius: 22px;
      color: #302d49;
      text-align: left;
      font-size: 17px;
      cursor: pointer;
      transition: transform .2s;
    }

    .topic:hover { transform: translateY(-4px); }
    .topic span { display: block; font-size: 38px; margin-bottom: 12px; }
    .topic small { display: block; margin-top: 8px; }

    .purple { background: #e9e2ff; }
    .green { background: #dff7eb; }
    .peach { background: #ffe6d7; }
    .yellow { background: #fff1b9; }
    .blue { background: #dcecff; }

    #quiz {
      margin-top: 25px;
      padding: 25px;
      background: white;
      border: 1px solid #eeeafa;
      border-radius: 24px;
    }

    #answers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
    }

    .answer {
      padding: 15px;
      border: 2px solid #eeeafa;
      border-radius: 14px;
      background: white;
      font-size: 16px;
      cursor: pointer;
    }

    .correct { background: #dff7eb; border-color: #65bf94; }
    .wrong { background: #ffe6d7; border-color: #e69b7a; }

    #feedback {
      min-height: 30px;
      font-weight: bold;
      margin: 18px 0;
    }

    .hidden { display: none; }

    footer {
      padding: 25px;
      margin-top: 35px;
      text-align: center;
      color: #77748b;
    }

    @media (max-width: 600px) {
      main { padding: 15px; }
      .hero { padding: 24px; flex-direction: column; align-items: flex-start; }
      .hero-art { align-self: center; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">🌈 EBKIDO</div>
  <select id="language" aria-label="Choose language">
    <option value="en">English</option>
    <option value="rw">Kinyarwanda</option>
    <option value="sv">Svenska</option>
    <option value="fr">Français</option>
  </select>
</header>

<main>
  <section class="hero">
    <div>
      <p id="eyebrow">A HAPPY PLACE TO LEARN</p>
      <h1 id="heroTitle">Big discoveries start with little steps!</h1>
      <p id="heroText">Learn letters, numbers, animals, colours and shapes through fun quizzes.</p>
      <a class="button" href="#lessons" id="startButton">Let's learn!</a>
      <p>⭐ <span id="stars">0</span> stars</p>
    </div>
    <div class="hero-art">🧸🌈</div>
  </section>

  <h2 class="section-title" id="chooseTitle">What shall we learn today?</h2>

  <section class="topics" id="lessons">
    <button class="topic purple" onclick="startQuiz('letters')">
      <span>🔤</span><strong id="letters">Letters</strong>
      <small>ABC</small>
    </button>
    <button class="topic green" onclick="startQuiz('numbers')">
      <span>🔢</span><strong id="numbers">Numbers</strong>
      <small>1, 2, 3</small>
    </button>
    <button class="topic peach" onclick="startQuiz('animals')">
      <span>🐼</span><strong id="animals">Animals</strong>
      <small>Animal friends</small>
    </button>
    <button class="topic yellow" onclick="startQuiz('colors')">
      <span>🎨</span><strong id="colors">Colours</strong>
      <small>Discover colours</small>
    </button>
    <button class="topic blue" onclick="startQuiz('shapes')">
      <span>🔺</span><strong id="shapes">Shapes</strong>
      <small>Circle, square...</small>
    </button>
  </section>

  <section id="quiz" class="hidden">
    <h2 id="question">Question</h2>
    <div id="answers"></div>
    <div id="feedback" aria-live="polite"></div>
    <button id="nextButton" class="button hidden" onclick="nextQuestion()">Next</button>
    <button class="button" onclick="closeQuiz()" style="background:#aaa">Close</button>
  </section>
</main>

<footer>© 2026 EBKIDO · Learn · Play · Grow</footer>

<script>
const translations = {
  en: {
    eyebrow:"A HAPPY PLACE TO LEARN",
    heroTitle:"Big discoveries start with little steps!",
    heroText:"Learn letters, numbers, animals, colours and shapes through fun quizzes.",
    start:"Let's learn!", chooseTitle:"What shall we learn today?",
    letters:"Letters",numbers:"Numbers",animals:"Animals",
    colors:"Colours",shapes:"Shapes",correct:"Wonderful! Correct! ⭐",
    wrong:"Good try! Let's learn together.",next:"Next",
    done:"Great work! You finished this lesson! 🎉"
  },
  rw: {
    eyebrow:"AHANTU HEZA HO KWIGIRA",
    heroTitle:"Ubumenyi butangirira ku ntambwe nto!",
    heroText:"Iga inyuguti, imibare, inyamaswa, amabara n'imiterere ukoresheje ibibazo bishimishije.",
    start:"Reka twige!",chooseTitle:"Uyu munsi twige iki?",
    letters:"Inyuguti",numbers:"Imibare",animals:"Inyamaswa",
    colors:"Amabara",shapes:"Imiterere",correct:"Ni byiza cyane! Igisubizo ni cyo! ⭐",
    wrong:"Gerageza nanone! Reka twige hamwe.",next:"Ibikurikira",
    done:"Akazi keza! Urangije iri somo! 🎉"
  },
  sv: {
    eyebrow:"EN GLAD PLATS ATT LÄRA SIG",
    heroTitle:"Stora upptäckter börjar med små steg!",
    heroText:"Lär dig bokstäver, siffror, djur, färger och former med roliga frågor.",
    start:"Nu lär vi oss!",chooseTitle:"Vad ska vi lära oss idag?",
    letters:"Bokstäver",numbers:"Siffror",animals:"Djur",
    colors:"Färger",shapes:"Former",correct:"Fantastiskt! Rätt svar! ⭐",
    wrong:"Bra försök! Vi lär oss tillsammans.",next:"Nästa",
    done:"Bra jobbat! Du är klar! 🎉"
  },
  fr: {
    eyebrow:"UN ENDROIT JOYEUX POUR APPRENDRE",
    heroTitle:"Les grandes découvertes commencent par de petits pas !",
    heroText:"Apprends les lettres, les nombres, les animaux, les couleurs et les formes.",
    start:"Apprenons !",chooseTitle:"Qu'allons-nous apprendre aujourd'hui ?",
    letters:"Lettres",numbers:"Nombres",animals:"Animaux",
    colors:"Couleurs",shapes:"Formes",correct:"Bravo ! Bonne réponse ! ⭐",
    wrong:"Bien essayé ! Apprenons ensemble.",next:"Suivant",
    done:"Bravo ! Tu as terminé ! 🎉"
  }
};

const questions = {
  letters: [
    {q:"Which is the letter A? / Inyuguti A ni iyihe?",a:["A","B","C"],c:0,s:"A"},
    {q:"Which letter comes after B?",a:["A","C","D"],c:1,s:"C"},
    {q:"Which letter starts Dog?",a:["D","G","O"],c:0,s:"D"}
  ],
  numbers: [
    {q:"How many stars? ⭐ ⭐ ⭐",a:["2","3","4"],c:1,s:"Three"},
    {q:"What comes after 4?",a:["3","5","6"],c:1,s:"Five"},
    {q:"What is 1 + 1?",a:["1","2","3"],c:1,s:"Two"}
  ],
  animals: [
    {q:"Which animal says meow?",a:["🐶 Dog","🐱 Cat","🐮 Cow"],c:1,s:"Cat"},
    {q:"Which animal has a long neck?",a:["🦒 Giraffe","🐸 Frog","🐟 Fish"],c:0,s:"Giraffe"},
    {q:"Which animal lives in water?",a:["🐰 Rabbit","🐟 Fish","🐔 Hen"],c:1,s:"Fish"}
  ],
  colors: [
    {q:"What colour is a banana?",a:["🔵 Blue","🟡 Yellow","🟣 Purple"],c:1,s:"Yellow"},
    {q:"What colour is grass?",a:["🟢 Green","🔴 Red","⚫ Black"],c:0,s:"Green"},
    {q:"What colour is a clear sky?",a:["🟠 Orange","🔵 Blue","🟤 Brown"],c:1,s:"Blue"}
  ],
  shapes: [
    {q:"Which shape has 3 sides?",a:["⚪ Circle","🔺 Triangle","🟦 Square"],c:1,s:"Triangle"},
    {q:"Which shape is round?",a:["⚪ Circle","🔺 Triangle","🟨 Rectangle"],c:0,s:"Circle"},
    {q:"How many sides does a square have?",a:["3","4","5"],c:1,s:"Four"}
  ]
};

let language = "en", topic = "", index = 0, answered = false;
let stars = Number(localStorage.getItem("ebkidoStars") || 0);
document.getElementById("stars").textContent = stars;

document.getElementById("language").addEventListener("change", e => {
  language = e.target.value;
  const t = translations[language];
  for (const id of ["eyebrow","heroTitle","heroText","start","chooseTitle",
    "letters","numbers","animals","colors","shapes"]) {
    const key = id === "start" ? "start" :
      id === "chooseTitle" ? "chooseTitle" : id;
    if (t[key]) {
      const el = document.getElementById(id === "start" ? "startButton" : id);
      el.textContent = t[key];
    }
  }
});

function startQuiz(selectedTopic) {
  topic = selectedTopic;
  index = 0;
  document.getElementById("quiz").classList.remove("hidden");
  showQuestion();
  document.getElementById("quiz").scrollIntoView({behavior:"smooth"});
}

function showQuestion() {
  answered = false;
  const item = questions[topic][index];
  document.getElementById("question").textContent = item.q;
  document.getElementById("feedback").textContent = "";
  document.getElementById("nextButton").classList.add("hidden");
  document.getElementById("nextButton").textContent =
    index === questions[topic].length - 1
      ? (language==="rw"?"Soza":language==="sv"?"Avsluta":language==="fr"?"Terminer":"Finish")
      : translations[language].next;
  const box = document.getElementById("answers");
  box.innerHTML = "";
  item.a.forEach((answer, i) => {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = answer;
    button.onclick = () => chooseAnswer(i, button);
    box.appendChild(button);
  });
}

function chooseAnswer(choice, button) {
  if (answered) return;
  answered = true;
  const item = questions[topic][index];
  const correct = choice === item.c;
  document.querySelectorAll(".answer").forEach((b,i) => {
    b.disabled = true;
    if (i === item.c) b.classList.add("correct");
  });
  if (!correct) button.classList.add("wrong");
  const feedback = document.getElementById("feedback");
  feedback.textContent = correct
    ? translations[language].correct
    : translations[language].wrong;
  if (correct) {
    stars++;
    localStorage.setItem("ebkidoStars", stars);
    document.getElementById("stars").textContent = stars;
  }
  speak(correct ? item.s : feedback.textContent);
  document.getElementById("nextButton").classList.remove("hidden");
}

function nextQuestion() {
  if (!answered) return;
  if (index < questions[topic].length - 1) {
    index++;
    showQuestion();
  } else {
    document.getElementById("question").textContent = translations[language].done;
    document.getElementById("answers").innerHTML = "⭐ " + stars;
    document.getElementById("feedback").textContent = "";
    document.getElementById("nextButton").classList.add("hidden");
    speak(translations[language].done);
  }
}

function closeQuiz() {
  document.getElementById("quiz").classList.add("hidden");
  topic = "";
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  const voice = new SpeechSynthesisUtterance(text);
  voice.lang = {en:"en-US",rw:"rw-RW",sv:"sv-SE",fr:"fr-FR"}[language];
  voice.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(voice);
}
</script>
</body>
</html>
