<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5efff">

  <title>Reset Password | EBKIDO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, sans-serif;
      color: #30234b;

      background:
        linear-gradient(
          135deg,
          #f5efff,
          #e5fbf4,
          #fff2e8
        );
    }

    .card {
      width: 100%;
      max-width: 430px;

      padding: 32px;

      background: white;
      border-radius: 28px;

      box-shadow:
        0 18px 50px rgba(70, 50, 100, .12);
    }

    .logo {
      text-align: center;

      color: #7654d6;

      font-size: 34px;
      font-weight: 800;
    }

    .icon {
      text-align: center;

      font-size: 58px;

      margin: 15px 0;
    }

    h1 {
      text-align: center;

      margin: 0 0 10px;

      font-size: 28px;
    }

    .intro {
      text-align: center;

      color: #776e88;

      line-height: 1.5;

      margin-bottom: 26px;
    }

    label {
      display: block;

      margin: 16px 0 7px;

      font-weight: 700;
    }

    .password-box {
      position: relative;
    }

    input {
      width: 100%;

      padding: 14px 15px;

      border: 1px solid #ddd5ed;

      border-radius: 13px;

      font-size: 16px;
    }

    .password-box input {
      padding-right: 75px;
    }

    input:focus {
      outline: none;

      border-color: #7654d6;

      box-shadow:
        0 0 0 3px rgba(118,84,214,.12);
    }

    .show {
      position: absolute;

      right: 10px;
      top: 50%;

      transform: translateY(-50%);

      border: 0;

      background: transparent;

      color: #7654d6;

      font-weight: 700;

      cursor: pointer;
    }

    .button {
      width: 100%;

      padding: 15px;

      margin-top: 23px;

      border: 0;

      border-radius: 14px;

      background: #7654d6;

      color: white;

      font-size: 17px;

      font-weight: 800;

      cursor: pointer;
    }

    .button:disabled {
      opacity: .6;

      cursor: wait;
    }

    .message {
      display: none;

      margin-top: 18px;

      padding: 13px;

      border-radius: 12px;

      line-height: 1.5;

      font-size: 14px;
    }

    .message.error {
      display: block;

      background: #fff0f0;

      color: #a33a3a;
    }

    .message.success {
      display: block;

      background: #eafaf2;

      color: #26734d;
    }

    .links {
      text-align: center;

      margin-top: 22px;

      line-height: 2;
    }

    a {
      color: #6845c3;

      font-weight: 700;

      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">
      🌈 EBKIDO
    </div>

    <div class="icon">
      🔐✨
    </div>

    <h1>
      Create a new password
    </h1>

    <p class="intro">
      Choose a new password for your EBKIDO account.
    </p>

    <form id="resetForm">

      <label for="password">
        New password
      </label>

      <div class="password-box">

        <input
          id="password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          placeholder="At least 8 characters"
          required
        >

        <button
          type="button"
          class="show"
          id="showPassword"
        >
          Show
        </button>

      </div>


      <label for="confirmPassword">
        Confirm new password
      </label>

      <div class="password-box">

        <input
          id="confirmPassword"
          type="password"
          minlength="8"
          autocomplete="new-password"
          placeholder="Repeat your password"
          required
        >

        <button
          type="button"
          class="show"
          id="showConfirm"
        >
          Show
        </button>

      </div>


      <button
        class="button"
        id="resetButton"
        type="submit"
      >
        Update password 🔑
      </button>

    </form>


    <div
      id="message"
      class="message"
      role="status"
      aria-live="polite"
    ></div>


    <div class="links">

      <a href="login.html">
        ← Back to login
      </a>

    </div>

  </main>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabaseClient.js"></script>


  <script>

    const form =
      document.getElementById("resetForm");

    const password =
      document.getElementById("password");

    const confirmPassword =
      document.getElementById("confirmPassword");

    const button =
      document.getElementById("resetButton");

    const message =
      document.getElementById("message");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    /*
      SHOW / HIDE PASSWORD
    */

    document
      .getElementById("showPassword")
      .addEventListener("click", () => {

        if (password.type === "password") {

          password.type = "text";

          document.getElementById(
            "showPassword"
          ).textContent = "Hide";

        } else {

          password.type = "password";

          document.getElementById(
            "showPassword"
          ).textContent = "Show";

        }

      });


    document
      .getElementById("showConfirm")
      .addEventListener("click", () => {

        if (confirmPassword.type === "password") {

          confirmPassword.type = "text";

          document.getElementById(
            "showConfirm"
          ).textContent = "Hide";

        } else {

          confirmPassword.type = "password";

          document.getElementById(
            "showConfirm"
          ).textContent = "Show";

        }

      });


    /*
      UPDATE PASSWORD
    */

    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const newPassword =
          password.value;

        const confirm =
          confirmPassword.value;


        if (newPassword.length < 8) {

          showMessage(
            "Your password must contain at least 8 characters.",
            "error"
          );

          return;
        }


        if (newPassword !== confirm) {

          showMessage(
            "The passwords do not match.",
            "error"
          );

          return;
        }


        button.disabled = true;

        button.textContent =
          "Updating password...";


        try {

          const {
            error
          } =
            await supabaseClient.auth
              .updateUser({
                password: newPassword
              });


          if (error) {
            throw error;
          }


          showMessage(
            "Password updated successfully! 🎉",
            "success"
          );


          form.reset();


          setTimeout(() => {

            window.location.href =
              "account.html";

          }, 1500);


        } catch (error) {

          console.error(error);

          showMessage(
            error.message ||
            "Could not update your password. Please request a new reset link.",
            "error"
          );


        } finally {

          button.disabled = false;

          button.textContent =
            "Update password 🔑";

        }

      }
    );

  </script>

</body>
</html>
